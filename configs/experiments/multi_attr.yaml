# @package _global_
# Multi-attribute transformation experiment

defaults:
  - override /data: celeba_hq
  - override /attributes: default

experiment:
  name: multi_attr_age_gender
  tags: ["multi-attribute", "age", "gender", "stylegan"]

# Override active attributes
attributes:
  active: ["age", "gender"]
  
  transform:
    mode: simultaneous
    null_space_projection: true
    
    # Target transformations
    targets:
      age: 2.5      # Towards "old"
      gender: -2.0  # Towards "female"

# Training overrides
training:
  max_epochs: 50
  
dataloader:
  batch_size: 8  # Smaller batch for multi-attribute

# Logging overrides
logging:
  log_images_every_n_steps: 250
